# Production: prebuilt images from GitHub Container Registry + the shared Supabase database.
# No database container and no schema commands: Supabase changes go through database.sql.
#   On the server, next to this file, create backend.env (see docs/DEPLOYMENT.md), then:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:-ugaynobu}/checkin-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: backend.env
    environment:
      PORT: 5000
      TRUST_PROXY: 1
    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-ugaynobu}/checkin-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads_data:
